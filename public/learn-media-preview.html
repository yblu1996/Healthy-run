<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学习园地矢量图升级预览（全部 18 张）</title>
<style>
  body{margin:0;min-height:100vh;background:#20262B;font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;color:#E8EDF0;padding:28px 16px;box-sizing:border-box}
  h1{font-size:18px;font-weight:700;margin:0 0 6px;text-align:center}
  p.sub{margin:0 0 22px;font-size:12.5px;color:#9AA7AE;text-align:center}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;max-width:1180px;margin:0 auto}
  .card{background:#F6F8F9;border-radius:14px;padding:12px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
  .card h2{margin:0 0 8px;font-size:12.5px;color:#5B6B62;text-align:center;font-weight:600}
  .card img{display:block;width:100%;height:auto;border-radius:10px}
</style>
</head>
<body>
  <h1>学习园地矢量图升级预览 · 全部 18 张</h1>
  <p class="sub">青绿色系与程序协调 · 动作动画与教学标注保留 · 原图备份在 learn-media/originals/</p>
  <div class="grid">
    <div class="card"><h2>01 跑姿要点</h2><img src="learn-media/01-run-form.svg?v=orig" alt="跑姿"></div>
    <div class="card"><h2>02 前倾对比</h2><img src="learn-media/02-run-lean.svg?v=orig" alt="前倾对比"></div>
    <div class="card"><h2>03 步频节奏</h2><img src="learn-media/03-run-cadence.svg?v=orig" alt="步频"></div>
    <div class="card"><h2>04 落地缓冲</h2><img src="learn-media/04-run-landing.svg?v=orig" alt="落地"></div>
    <div class="card"><h2>05 腿部摆动</h2><img src="learn-media/05-dyn-leg-swing.svg?v=orig" alt="摆腿"></div>
    <div class="card"><h2>06 弓步</h2><img src="learn-media/06-dyn-lunge.svg?v=orig" alt="弓步"></div>
    <div class="card"><h2>07 高抬腿</h2><img src="learn-media/07-dyn-high-knees.svg?v=orig" alt="高抬腿"></div>
    <div class="card"><h2>08 髋部环绕</h2><img src="learn-media/08-dyn-hip-circle.svg?v=orig" alt="髋环绕"></div>
    <div class="card"><h2>09 小腿拉伸</h2><img src="learn-media/09-st-calf.svg?v=orig" alt="小腿"></div>
    <div class="card"><h2>10 股四头肌拉伸</h2><img src="learn-media/10-st-quad.svg?v=orig" alt="股四头肌"></div>
    <div class="card"><h2>11 腘绳肌拉伸</h2><img src="learn-media/11-st-hamstring.svg?v=orig" alt="腘绳肌"></div>
    <div class="card"><h2>12 髋屈肌拉伸</h2><img src="learn-media/12-st-hipflexor.svg?v=orig" alt="髋屈肌"></div>
    <div class="card"><h2>13 臀肌拉伸</h2><img src="learn-media/13-st-glute.svg?v=orig" alt="臀肌"></div>
    <div class="card"><h2>14 深蹲</h2><img src="learn-media/14-squat.svg?v=orig" alt="深蹲"></div>
    <div class="card"><h2>15 臀桥</h2><img src="learn-media/15-glute-bridge.svg?v=orig" alt="臀桥"></div>
    <div class="card"><h2>16 单腿硬拉</h2><img src="learn-media/16-sl-deadlift.svg?v=orig" alt="硬拉"></div>
    <div class="card"><h2>17 平板支撑</h2><img src="learn-media/17-plank.svg?v=orig" alt="平板"></div>
    <div class="card"><h2>18 提踵</h2><img src="learn-media/18-calf-raise.svg?v=orig" alt="提踵"></div>
  </div>
</body>
</html>
